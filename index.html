<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Delivery</title>
  </head>
  <body>
    <div id="app">
      <div id="pointer-lock-overlay">
        <div class="pl-title">LAST DELIVERY</div>
        <div class="pl-controls">WASD Move &middot; Mouse Camera &middot; E Enter vehicle</div>
        <div class="pl-click">Click to play</div>
      </div>
      <div id="interaction-prompt" class="hidden"></div>
      <div id="mission-hud" class="hidden">
        <div class="mission-title">THE BLACKOUT JOB</div>
        <div class="mission-objective"></div>
        <div class="mission-timer" style="display: none"></div>
      </div>
      <div id="mission-banner">
        <div class="banner-title"></div>
        <div class="banner-sub"></div>
      </div>
      <div id="objective-arrow"></div>
      <div id="busted-overlay" class="hidden">
        <div class="busted-title">BUSTED</div>
        <div class="busted-sub">Press R to restart</div>
      </div>
      <div id="success-overlay" class="hidden">
        <div class="success-title">THE BLACKOUT JOB COMPLETE</div>
        <div class="success-lines">
          <div class="success-score"></div>
          <div class="success-time"></div>
          <div class="success-damage"></div>
        </div>
        <div class="success-sub">Press R to restart</div>
      </div>
      <div id="wanted-display">
        <span class="wanted-label">WANTED</span>
        <span class="wanted-stars"></span>
      </div>
      <div id="hud-top-left">
        <div id="minimap"></div>
        <div id="controls-panel"></div>
      </div>
      <div id="map-overlay">
        <div class="map-title">CITY MAP</div>
      </div>
      <div id="debug-overlay" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
